<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulip Chat Analysis</title>
<style>
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --pre:#2a78d6; --post:#eb6834; --other:#8a887f; --bar:#2a78d6;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --pre-soft:rgba(42,120,214,0.12); --post-soft:rgba(235,104,52,0.12); --ln-soft:rgba(6,199,85,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
      --pre:#3987e5; --post:#d95926; --other:#898781; --bar:#3987e5;
      --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
      --pre-soft:rgba(57,135,229,0.20); --post-soft:rgba(217,89,38,0.20); --ln-soft:rgba(6,199,85,.22);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --pre:#3987e5; --post:#d95926; --other:#898781; --bar:#3987e5;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --pre-soft:rgba(57,135,229,0.20); --post-soft:rgba(217,89,38,0.20); --ln-soft:rgba(6,199,85,.22);
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.55; padding:24px 16px 48px}
  .wrap{max-width:880px; margin:0 auto}
  header{margin-bottom:8px}
  h1{font-size:1.5rem; margin:0 0 4px}
  .sub{color:var(--ink-2); font-size:.9rem; margin:0}
  .meta{color:var(--muted); font-size:.8rem; margin-top:4px}
  .topbar{position:fixed; top:12px; right:12px; z-index:10; display:flex; gap:6px}
  .seg-ctl{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden}
  .seg-ctl button{background:transparent; color:var(--ink-2); border:0; padding:6px 10px; font-size:.78rem; cursor:pointer; font-family:inherit}
  .seg-ctl button.on{background:var(--pre); color:#fff}
  .theme-btn{background:var(--surface); color:var(--ink-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:.8rem; cursor:pointer; font-family:inherit}

  /* tabs */
  .tabs{display:flex; gap:6px; margin:18px 0 8px; border-bottom:1px solid var(--grid)}
  .tabs button{background:transparent; border:0; border-bottom:2px solid transparent; color:var(--ink-2);
    padding:10px 14px; font-size:.92rem; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:-1px}
  .tabs button.on{color:var(--pre); border-bottom-color:var(--pre)}
  .panel{display:none} .panel.on{display:block}

  .section-head{display:flex; align-items:center; gap:10px; margin:32px 0 4px; flex-wrap:wrap}
  .section-head:first-child{margin-top:16px}
  .section-head .tag{font-size:.72rem; font-weight:700; letter-spacing:.04em; padding:3px 8px; border-radius:6px}
  .tag.mg{background:var(--pre-soft); color:var(--pre)}
  .tag.ln{background:var(--ln-soft); color:#06843f}
  .tag.sc{background:var(--post-soft); color:var(--post)}
  :root[data-theme="dark"] .tag.ln{color:#3ddc85}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.ln{color:#3ddc85}}
  .section-head h2{font-size:1.15rem; margin:0}
  hr.div{border:0; border-top:1px solid var(--grid); margin:0}

  .tiles{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:12px; margin:16px 0}
  @media(max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px}
  @media(max-width:560px){.tile.hero{grid-column:1/-1}}
  .tile .lab{font-size:.8rem; color:var(--ink-2); display:flex; align-items:center; gap:6px}
  .tile .val{font-size:1.8rem; font-weight:700; margin-top:4px; letter-spacing:-.02em}
  .tile.hero .val{font-size:2.6rem; color:var(--pre)}
  .tile.hero.green .val{color:var(--good)}
  .tile .n{font-size:.8rem; color:var(--muted); margin-top:2px}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none}
  .dot.pre{background:var(--pre)} .dot.post{background:var(--post)} .dot.other{background:var(--other)}
  .dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 18px 8px; margin-bottom:16px}
  .card h3{font-size:1rem; margin:0 0 2px}
  .card .hint{font-size:.8rem; color:var(--muted); margin:0 0 14px}
  .legend{display:flex; gap:16px; flex-wrap:wrap; margin:0 0 16px; font-size:.82rem; color:var(--ink-2)}
  .legend span{display:flex; align-items:center; gap:6px}
  .row{display:grid; grid-template-columns:150px 1fr; gap:10px; align-items:center; margin-bottom:9px}
  @media(max-width:560px){.row{grid-template-columns:110px 1fr}}
  .row .name{font-size:.8rem; color:var(--ink-2); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .track{position:relative; height:26px; background:var(--grid); border-radius:6px; overflow:hidden; display:flex; align-items:center}
  .bar{height:100%; border-radius:0 6px 6px 0; min-width:2px; display:flex; align-items:center; justify-content:flex-end;
       padding-right:8px; color:#fff; font-size:.78rem; font-weight:600; font-variant-numeric:tabular-nums; transition:filter .12s; cursor:default; flex:none}
  .bar.pre{background:var(--pre)} .bar.post{background:var(--post)} .bar.other{background:var(--other)} .bar.solid{background:var(--bar)}
  .bar:hover{filter:brightness(1.06)}
  .bar-out{font-size:.78rem; font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums; padding-left:8px; white-space:nowrap; flex:none}

  #tip{position:fixed; z-index:20; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--ink); color:var(--surface); padding:7px 10px; border-radius:8px; font-size:.78rem; max-width:260px}
  #tip b{font-weight:700}

  .stack{display:flex; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--border)}
  .seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:.78rem; font-weight:700}
  .seg.g{background:var(--good)} .seg.w{background:var(--warn); color:#3a2a00} .seg.c{background:var(--crit)} .seg.o{background:var(--other)}
  .stack-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:.8rem; color:var(--ink-2)}

  .note{background:var(--post-soft); border:1px solid var(--border); border-left:3px solid var(--post);
    border-radius:10px; padding:12px 14px; font-size:.85rem; color:var(--ink-2); margin-bottom:16px}
  .note b{color:var(--ink)}
  .find{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:16px}
  .find h3{font-size:1rem; margin:0 0 10px}
  .find ul{margin:0; padding-left:18px}
  .find li{font-size:.88rem; color:var(--ink-2); margin-bottom:8px}
  .find li b{color:var(--ink)}

  details{margin-top:4px; margin-bottom:16px}
  summary{cursor:pointer; font-size:.85rem; color:var(--ink-2); padding:6px 0}
  table{width:100%; border-collapse:collapse; font-size:.8rem; margin-top:8px}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--grid); vertical-align:top}
  th{color:var(--muted); font-weight:600}
  td.c{text-align:center}
  td.num{text-align:right; font-variant-numeric:tabular-nums}
  .pill{font-size:.72rem; padding:1px 7px; border-radius:20px; white-space:nowrap}
  .pill.ok{background:rgba(12,163,12,.14); color:var(--good)}
  .pill.pend{background:rgba(250,178,25,.16); color:#8a6100}
  :root[data-theme="dark"] .pill.pend{color:var(--warn)}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.pend{color:var(--warn)}}
  .pill.mute{background:var(--grid); color:var(--ink-2)}
  .foot{color:var(--muted); font-size:.75rem; margin-top:28px; text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <div class="seg-ctl" id="langCtl">
    <button data-lang="th">ไทย</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button>
  </div>
  <button class="theme-btn" id="themeBtn" data-i18n="themeBtn">◐</button>
</div>

<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
    <p class="meta" data-i18n="meta"></p>
  </header>

  <div class="tabs" id="tabs">
    <button data-tab="main" class="on" data-i18n="tab_main"></button>
    <button data-tab="shot" data-i18n="tab_shot"></button>
  </div>

  <!-- ================= TAB 1: MAIN (Messenger + LINE) ================= -->
  <div class="panel on" id="panel-main">
    <div class="section-head"><span class="tag mg">MESSENGER</span><h2 data-i18n="s1_h2"></h2></div>
    <p class="sub" data-i18n="s1_sub"></p>
    <div class="tiles">
      <div class="tile hero"><div class="lab"><span class="dot pre"></span><span data-i18n="t_pre"></span></div>
        <div class="val">72.6%</div><div class="n" data-i18n="t_pre_n"></div></div>
      <div class="tile"><div class="lab"><span class="dot post"></span><span data-i18n="t_post"></span></div>
        <div class="val">16.7%</div><div class="n" data-i18n="t_post_n"></div></div>
      <div class="tile"><div class="lab"><span class="dot other"></span><span data-i18n="t_other"></span></div>
        <div class="val">10.7%</div><div class="n" data-i18n="t_other_n"></div></div>
    </div>
    <div class="card">
      <h3 data-i18n="s1_card_h"></h3><p class="hint" data-i18n="s1_card_hint"></p>
      <div class="legend">
        <span><span class="dot pre"></span><span data-i18n="lg_pre"></span></span>
        <span><span class="dot post"></span><span data-i18n="lg_post"></span></span>
        <span><span class="dot other"></span><span data-i18n="lg_other"></span></span>
      </div>
      <div id="mgChart"></div>
    </div>
    <div class="note" data-i18n="mg_note"></div>

    <hr class="div">
    <div class="section-head"><span class="tag ln" data-i18n="tag_brand"></span><h2>Tulip Sino × Wkwk</h2></div>
    <p class="sub" data-i18n="s2_sub"></p>
    <div class="tiles">
      <div class="tile"><div class="lab" data-i18n="msgs"></div><div class="val">1,660</div><div class="n" data-i18n="s2_days"></div></div>
      <div class="tile"><div class="lab" data-i18n="top_topic"></div><div class="val" style="font-size:1.2rem" data-i18n="content_w"></div><div class="n" data-i18n="times163"></div></div>
      <div class="tile"><div class="lab" data-i18n="cust_claim"></div><div class="val">5</div><div class="n" data-i18n="in3yr"></div></div>
    </div>
    <div class="card"><h3 data-i18n="topics_h"></h3><p class="hint" data-i18n="s2_hint"></p><div id="lnBrandChart"></div></div>

    <hr class="div">
    <div class="section-head"><span class="tag ln" data-i18n="tag_cs"></span><h2>CS Asian Bridge × Wkwk</h2></div>
    <p class="sub" data-i18n="s3_sub"></p>
    <div class="card">
      <h3 data-i18n="resp_h"></h3><p class="hint" data-i18n="resp_hint"></p>
      <div class="stack"><div class="seg g" style="width:73.9%">73.9%</div><div class="seg w" style="width:18.2%">18.2%</div><div class="seg c" style="width:7.9%">7.9%</div></div>
      <div class="stack-legend">
        <span><span class="dot good"></span><span data-i18n="rl_1h"></span></span>
        <span><span class="dot warn"></span><span data-i18n="rl_24h"></span></span>
        <span><span class="dot crit"></span><span data-i18n="rl_over"></span></span>
      </div>
    </div>
    <div class="card"><h3 data-i18n="topics_h2"></h3><p class="hint" data-i18n="s3_hint"></p><div id="lnCsChart"></div></div>

    <div class="find">
      <h3 data-i18n="find_h"></h3>
      <ul><li data-i18n="find_1"></li><li data-i18n="find_2"></li><li data-i18n="find_3"></li></ul>
    </div>
  </div>

  <!-- ================= TAB 2: SCREENSHOTS (39 customers) ================= -->
  <div class="panel" id="panel-shot">
    <div class="section-head"><span class="tag sc" data-i18n="sc_tag"></span><h2 data-i18n="sc_h2"></h2></div>
    <p class="sub" data-i18n="sc_sub"></p>
    <p class="meta" data-i18n="sc_meta"></p>

    <div class="tiles">
      <div class="tile hero"><div class="lab" data-i18n="sc_cust"></div><div class="val">39</div><div class="n" data-i18n="sc_cust_n"></div></div>
      <div class="tile hero green"><div class="lab"><span class="dot good"></span><span data-i18n="sc_resolved"></span></div><div class="val">71.8%</div><div class="n" data-i18n="sc_resolved_n"></div></div>
      <div class="tile"><div class="lab"><span class="dot warn"></span><span data-i18n="sc_slow"></span></div><div class="val">41%</div><div class="n" data-i18n="sc_slow_n"></div></div>
    </div>

    <div class="card">
      <h3 data-i18n="sc_cat_h"></h3><p class="hint" data-i18n="sc_cat_hint"></p>
      <div id="scChart"></div>
    </div>

    <div class="card">
      <h3 data-i18n="sc_out_h"></h3><p class="hint" data-i18n="sc_out_hint"></p>
      <div class="stack"><div class="seg g" style="width:71.8%">71.8%</div><div class="seg w" style="width:25.6%">25.6%</div><div class="seg o" style="width:2.6%"></div></div>
      <div class="stack-legend">
        <span><span class="dot good"></span><span data-i18n="sc_o_ok"></span></span>
        <span><span class="dot warn"></span><span data-i18n="sc_o_pend"></span></span>
        <span><span class="dot other"></span><span data-i18n="sc_o_silent"></span></span>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="sc_beh_h"></h3><p class="hint" data-i18n="sc_beh_hint"></p>
      <div class="tiles" style="margin:0">
        <div class="tile"><div class="lab" data-i18n="sc_b_slow"></div><div class="val">16<span style="font-size:1rem;color:var(--muted)">/39</span></div><div class="n">~41%</div></div>
        <div class="tile"><div class="lab" data-i18n="sc_b_auto"></div><div class="val">~13<span style="font-size:1rem;color:var(--muted)">/39</span></div><div class="n">~34%</div></div>
        <div class="tile"><div class="lab" data-i18n="sc_b_lead"></div><div class="val">~9</div><div class="n" data-i18n="sc_b_lead_n"></div></div>
      </div>
    </div>

    <div class="find">
      <h3 data-i18n="sc_find_h"></h3>
      <ul>
        <li data-i18n="sc_f1"></li><li data-i18n="sc_f2"></li><li data-i18n="sc_f3"></li>
        <li data-i18n="sc_f4"></li><li data-i18n="sc_f5"></li><li data-i18n="sc_f6"></li>
      </ul>
    </div>

    <details open>
      <summary data-i18n="sc_tbl_sum"></summary>
      <table>
        <thead><tr>
          <th>ID</th><th data-i18n="sc_th_cat"></th><th data-i18n="sc_th_intent"></th>
          <th data-i18n="sc_th_out"></th><th class="c" data-i18n="sc_th_auto"></th><th class="c" data-i18n="sc_th_slow"></th>
        </tr></thead>
        <tbody id="scBody"></tbody>
      </table>
    </details>
  </div>

  <p class="foot" data-i18n="foot"></p>
</div>
<div id="tip"></div>

<script>
const S={
 th:{ themeBtn:"◐ ธีม", title:"สรุปวิเคราะห์แชทลูกค้า Tulip",
  subtitle:"วิเคราะห์หลายแหล่งข้อมูลแยกกัน (ไม่รวมกัน)",
  meta:"ปิดบังชื่อ/เบอร์/ที่อยู่แล้ว (PDPA) · แสดงเฉพาะตัวเลขสรุป ไม่มีข้อมูลรายบุคคล",
  tab_main:"แชทหลัก (Messenger + LINE)", tab_shot:"รูปแคปแชท (39 ราย)",
  s1_h2:"ลูกค้า → เพจ", s1_sub:"ลูกค้าทักเข้ามาเรื่องอะไรบ้าง · 383 บทสนทนา · 365 วัน",
  t_pre:"ก่อนการขาย (สนใจสินค้า)", t_pre_n:"278 จาก 383 บทสนทนา",
  t_post:"บริการหลังการขาย", t_post_n:"64 บทสนทนา", t_other:"อื่นๆ/ไม่ชัด", t_other_n:"41 บทสนทนา",
  s1_card_h:"ประเภทการคุย 9 หมวด", s1_card_hint:"เรียงจากมากไปน้อย · สีตามช่วงความสัมพันธ์",
  lg_pre:"🛒 ก่อนการขาย", lg_post:"📦 หลังการขาย", lg_other:"❔ อื่นๆ",
  mg_note:"<b>⚠️ อ่านประกอบ:</b> ตัวเลขจากการจับคีย์เวิร์ด (rule-based) — หมวด “ทักทาย” (36%) อาจเหมารวมเกินจริง",
  tag_brand:"LINE · แบรนด์", tag_cs:"LINE · CS",
  s2_sub:"สายประสานงานแบรนด์/แคมเปญ · ~3 ปี (ต.ค. 2023 → ก.ย. 2026)",
  msgs:"ข้อความรวม", s2_days:"249 วันมีแชท", top_topic:"หัวข้อเด่น", content_w:"คอนเทนต์", times163:"163 ครั้ง",
  cust_claim:"เคลมลูกค้า", in3yr:"ครั้ง ใน 3 ปี", topics_h:"หัวข้อที่คุยกัน", s2_hint:"นับด้วยคีย์เวิร์ด · เรื่องลูกค้ารายวันแทบไม่ปรากฏ",
  s3_sub:"สายแก้ปัญหาลูกค้าจริง · ~1 ปี (ก.ย. 2025 → ก.ย. 2026) · 1,227 ข้อความ",
  resp_h:"⏱️ เวลาที่ CS รอ Wakuwaku ตอบ", resp_hint:"จาก 241 คู่ถาม-ตอบ · median 9 นาที · คอขวดอยู่ที่หางที่รอแบรนด์",
  rl_1h:"ตอบใน 1 ชม. — 73.9%", rl_24h:"1–24 ชม. — 18.2%", rl_over:"เกิน 24 ชม. — 7.9% (~19 เคส)",
  topics_h2:"หัวข้อที่คุยกัน", s3_hint:"นับด้วยคีย์เวิร์ด · ของรางวัล/พัสดุ/เคลม เด่น",
  find_h:"ข้อค้นพบ (แชทหลัก)",
  find_1:"<b>สายแบรนด์ vs สาย CS แยกกันชัด</b> — แบรนด์คุยคอนเทนต์/แคมเปญ · CS คุยของรางวัล/พัสดุ/เคลม",
  find_2:"<b>คอขวดไม่ใช่ความเร็วทีม</b> — Wakuwaku ตอบเร็ว (median 9 นาที) ปัญหาคือหาง 7.9% ที่รอแบรนด์",
  find_3:"<b>“ของรางวัล/แลกของ” คือจุดร่วม</b> — เด่นทั้ง Messenger และ LINE CS → ทำคลังคำตอบมาตรฐานก่อน",
  // TAB 2
  sc_tag:"SCREENSHOT", sc_h2:"รูปแคปแชท (39 ราย)",
  sc_sub:"แชทเต็มเธรดที่ capture มือ · 116 ภาพ · เห็นทั้งคำตอบแอด + auto-response + เวลา",
  sc_meta:"วิเคราะห์แยกจากชุด API 383 และ LINE · เก็บเฉพาะตัวเลขสรุป ปิดบัง PII",

const tip=document.getElementById("tip");
let LANG=(function(){try{return localStorage.getItem("tulip_lang")}catch(e){return null}})()||"th";
function nm(k){return (NAMES[k]&&NAMES[k][LANG])||(NAMES[k]&&NAMES[k].th)||k}

function drawBars(elId, rows, dfltCls){
  const el=document.getElementById(elId); if(!el)return; el.innerHTML="";
  const max=Math.max(...rows.map(r=>r.n));
  rows.forEach(d=>{
    const row=document.createElement("div"); row.className="row";
    const nmEl=document.createElement("div"); nmEl.className="name"; nmEl.textContent=nm(d.k); nmEl.title=nm(d.k);
    const track=document.createElement("div"); track.className="track";
    const pct=d.n/max*100, txt=d.label!==undefined?d.label:String(d.n), inside=pct>=28;
    const bar=document.createElement("div"); bar.className="bar "+(d.cls||dfltCls); bar.style.width=pct+"%";
    if(inside) bar.textContent=txt;
    const grp=d.gk?(" · "+S[LANG][d.gk]):""; const detail=d.pc?`${d.n} · ${d.pc}${grp}`:`${d.n}`;
    const show=e=>{tip.style.opacity=1; tip.innerHTML=`<b>${nm(d.k)}</b><br>${detail}`;
      tip.style.left=Math.min(e.clientX+14,innerWidth-270)+"px"; tip.style.top=(e.clientY+14)+"px";};
    bar.addEventListener("mousemove",show); bar.addEventListener("mouseleave",()=>tip.style.opacity=0);
    track.appendChild(bar);
    if(!inside){const out=document.createElement("span"); out.className="bar-out"; out.textContent=txt;
      out.addEventListener("mousemove",show); out.addEventListener("mouseleave",()=>tip.style.opacity=0); track.appendChild(out);}
    row.appendChild(nmEl); row.appendChild(track); el.appendChild(row);
  });
}
function renderScTable(){
  const tb=document.getElementById("scBody"); if(!tb)return; tb.innerHTML="";
  const OUT={ok:["ok","ตอบจบ","Resolved","解決"],pend:["pend","ค้าง","Pending","保留"],silent:["mute","เงียบ","Silent","沈黙"]};
  const li=LANG==="en"?2:(LANG==="ja"?3:1);
  scRows.forEach(r=>{
    const o=OUT[r[3]];
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r[0]}</td><td>${nm(r[1])}</td><td>${r[2]}</td>`+
      `<td><span class="pill ${o[0]}">${o[li]}</span></td>`+
      `<td class="c">${r[4]?"●":"–"}</td><td class="c">${r[5]?"●":"–"}</td>`;
    tb.appendChild(tr);
  });
}
function applyLang(){
  const dict=S[LANG]; document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.getAttribute("data-i18n"); if(dict[k]!==undefined) el.innerHTML=dict[k];});
  document.querySelectorAll("#langCtl button").forEach(b=>b.classList.toggle("on", b.dataset.lang===LANG));
  drawBars("mgChart",mg); drawBars("lnBrandChart",lnBrand,"solid"); drawBars("lnCsChart",lnCs,"solid"); drawBars("scChart",sc,"post");
  renderScTable();
  try{localStorage.setItem("tulip_lang",LANG)}catch(e){}
}
document.getElementById("langCtl").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b)return; LANG=b.dataset.lang; applyLang();});
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; const t=b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="panel-"+t));
  scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
});
applyLang();
</script>
</body>
</html>
