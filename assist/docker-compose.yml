services:
  assist:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env            # fill from .env.example (NEVER commit the real .env)
    volumes:
      - ./data:/app/data   # persist the SQLite ticket store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
